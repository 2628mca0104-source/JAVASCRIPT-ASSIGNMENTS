<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>University Registration</h1>
    <form action="" id="regForm">
        <label for="">Name:</label>
        <input type="text" placeholder="Enter Your Name" id="name">
         <br><br>

         <label for="">Email:</label>:</label>
        <input type="email" placeholder="Enter Your Email" id="Email">
        <br><br>

        <label for="">Age:</label>
        <input type="number" placeholder="Enter Your Age" id="Age">
        <br><br>

        <label for="">Gender:</label>
        <input type="radio"  name="gender">Male
        <input type="radio" name="gender">Female
        <br><br>

        <label for="">Cource:</label>
        <select name="cource" id="">
            <option >Select Cource</option>
            <option >BCA</option>
            <option >MBA</option>
            <option >M.TECH</option>
        </select>
        <BR></BR>

        <label for="">Study Mode:</label>
        <input type="radio" name="study">Regular
         <input type="radio" name="study">Distance
         <br><br>

         <label for="">Password:</label>
         <input type="password" placeholder="Enter Your Password">
         <br><br>

         <label for="">Confirm Password:</label>
         <input type="password" placeholder="Enter Your Confirm Password">
         <br><br>

         <input type="checkbox">I accept the Terms and Conditions.
         <br><br>

         <button>Register</button>
    </form>
</body>
</html>
